version: "3.8"

services:
  # ----------------------------------------------------------------------------
  # MySQL Database Service
  # ----------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: shein-mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-mysql}
      MYSQL_DATABASE: ${DB_NAME:-shein}
    volumes:
      - shein_mysql_data:/var/lib/mysql
      - ./shein_database.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - shein-network

  # ----------------------------------------------------------------------------
  # Python Scraper API Service (Playwright Headless)
  # ----------------------------------------------------------------------------
  scraper:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: shein-scraper
    restart: unless-stopped
    environment:
      DB_URL: mysql+pymysql://root:${DB_PASSWORD:-mysql}@mysql:3306/${DB_NAME:-shein}
      APP_SECRET: ${APP_SECRET:-super_secure_app_secret_key_1234567890_32chars}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-super_secure_internal_token_1234567890_32}
      SHEIN_LOCAL_API_TOKEN: ${INTERNAL_API_TOKEN:-super_secure_internal_token_1234567890_32}
      PLAYWRIGHT_HEADLESS: "1"
      SHEIN_PLAYWRIGHT_CHANNEL: chromium
      SHEIN_PLAYWRIGHT_PROFILES_DIR: /app/profiles
      SHEIN_MANUAL_LOGIN_TIMEOUT_SECONDS: ${SHEIN_MANUAL_LOGIN_TIMEOUT_SECONDS:-1800}
      SHEIN_ENABLE_REMOTE_BROWSER: ${SHEIN_ENABLE_REMOTE_BROWSER:-1}
      DISPLAY: :99
    volumes:
      - shein_profiles:/app/profiles
    ports:
      - "127.0.0.1:${BROWSER_PORT:-6080}:6080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s http://127.0.0.1:8000/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - shein-network

  # ----------------------------------------------------------------------------
  # Fullstack Node.js Backend & React Application Service
  # ----------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shein-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8081
      HOST: "0.0.0.0"
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-shein}
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-mysql}
      JWT_SECRET: ${JWT_SECRET:-super_secure_jwt_secret_key_1234567890_32chars}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-super_secure_encryption_key_1234567890_32}
      SHEIN_LOCAL_API_BASE_URL: http://scraper:8000
      SHEIN_LOCAL_API_TOKEN: ${INTERNAL_API_TOKEN:-super_secure_internal_token_1234567890_32}
      SHEIN_PROFILE_API_TIMEOUT_MS: ${SHEIN_PROFILE_API_TIMEOUT_MS:-10000}
      SHEIN_REMOTE_BROWSER_URL: ${SHEIN_REMOTE_BROWSER_URL:-https://shein-tracker.duckdns.org/vnc/vnc.html?path=websockify&autoconnect=true&resize=scale}
      ALLOWED_ORIGINS: "*"
      SEED_ADMIN: "1"
      SEED_DEMO_ACCOUNTS: "0"
    depends_on:
      mysql:
        condition: service_healthy
      scraper:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8081"
    networks:
      - shein-network

  # ----------------------------------------------------------------------------
  # Nginx Gateway & Reverse Proxy (HTTP & HTTPS)
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: shein-nginx
    restart: unless-stopped
    profiles:
      - standalone
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - shein-network

volumes:
  shein_mysql_data:
    driver: local
  shein_profiles:
    driver: local

networks:
  shein-network:
    driver: bridge
